<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script src="/arcade.js" async></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=10" />
    <link rel="alternate icon" type="image/png" sizes="512x512" href="/logo.png?v=10" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=10" />
    <link rel="manifest" href="/manifest.json?v=10" />
    <meta name="description" content="DataVerse — The next-generation social network and real-time community hub crafted by Datalex. Connect, share photos and videos, chat in real time, and explore vibrant creators." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://dataverse.datalexcloud.tech" />

    <!-- Open Graph / Facebook / WhatsApp / TestMyBuild -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DataVerse" />
    <meta property="og:url" content="https://dataverse.datalexcloud.tech" />
    <meta property="og:title" content="DataVerse — Social Network by Datalex" />
    <meta property="og:description" content="Connect, share photos and videos, chat in real time, and explore vibrant creators on DataVerse." />
    <meta property="og:image" content="https://dataverse.datalexcloud.tech/og-image.png?v=10" />
    <meta property="og:image:secure_url" content="https://dataverse.datalexcloud.tech/og-image.png?v=10" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DataVerse Social Network" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DataVerse — Social Network by Datalex" />
    <meta name="twitter:description" content="Connect, share photos and videos, chat in real time, and explore vibrant creators on DataVerse." />
    <meta name="twitter:image" content="https://dataverse.datalexcloud.tech/og-image.png?v=10" />

    <!-- Viewport with interactive-widget=resizes-content for mobile keyboards -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>DataVerse — Social Network by Datalex</title>
    <!-- Asset & Font Preloads for Instant First Paint -->
    <link rel="preload" as="image" href="/logo.png?v=11" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<!-- THEME START -->
    <meta name="theme-color" content="#040b0d" id="theme-color-meta" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('dv-theme') || 'system';
          var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', isDark ? '#040b0d' : '#faf6ee');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <!-- THEME END -->
    <style>
      html {
        scroll-behavior: smooth;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: 'Outfit', sans-serif;
        background-color: var(--bg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      @keyframes dvPulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes dvShimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body class="bg-[var(--bg)] text-[var(--text)] antialiased min-h-screen overflow-x-hidden">
    <div id="root">
      <!-- Zero-latency inline branded splash screen: instantly visible on initial HTML parse -->
      <div id="app-init-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:99999;user-select:none;">
        <div style="position:relative;width:68px;height:68px;border-radius:50%;box-shadow:0 0 24px rgba(45,212,191,0.25);display:flex;align-items:center;justify-content:center;overflow:hidden;animation:dvPulse 2s cubic-bezier(0.4,0,0.6,1) infinite;">
          <img src="/logo.png?v=11" alt="DataVerse" width="68" height="68" style="width:100%;height:100%;object-fit:contain;border-radius:50%;" />
        </div>
        <div style="margin-top:16px;font-family:'Outfit',sans-serif;font-size:17px;font-weight:700;letter-spacing:0.04em;color:var(--text);display:flex;align-items:center;gap:1px;">
          <span>Data</span><span style="color:var(--accent-2,#2dd4bf);">Verse</span>
        </div>
        <div style="width:100px;height:2.5px;background:rgba(45,212,191,0.15);border-radius:99px;margin-top:14px;overflow:hidden;position:relative;">
          <div style="position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,#2dd4bf,transparent);animation:dvShimmer 1.4s ease-in-out infinite;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
