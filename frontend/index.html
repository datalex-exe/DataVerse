<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script src="/arcade.js" async></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/logo.png" />
    <meta name="description" content="DataVerse — The next-generation social network and real-time community hub crafted by Datalex. Connect, share photos and videos, chat in real time, and explore vibrant creators." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://dataverse-datalex.pages.dev" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DataVerse" />
    <meta property="og:url" content="https://dataverse-datalex.pages.dev" />
    <meta property="og:title" content="DataVerse — Social Network by Datalex" />
    <meta property="og:description" content="Connect, share photos and videos, chat in real time, and explore vibrant creators on DataVerse." />
    <meta property="og:image" content="https://dataverse-datalex.pages.dev/logo.png" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DataVerse — Social Network by Datalex" />
    <meta name="twitter:description" content="Connect, share photos and videos, chat in real time, and explore vibrant creators on DataVerse." />
    <meta name="twitter:image" content="https://dataverse-datalex.pages.dev/logo.png" />

    <!-- Viewport with interactive-widget=resizes-content for mobile keyboards -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>DataVerse — Social Network by Datalex</title>
    <!-- Google Fonts for premium design -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<!-- THEME START -->
    <meta name="theme-color" content="#040b0d" id="theme-color-meta" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('dv-theme') || 'system';
          var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', isDark ? '#040b0d' : '#faf6ee');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <!-- THEME END -->
    <style>
      body {
        font-family: 'Outfit', sans-serif;
        /* BUG 3 FIX: Set body background to var(--bg) to prevent black gap during keyboard animations */
        background-color: var(--bg);
      }
    </style>
  </head>
  <body class="bg-[var(--bg)] text-[var(--text)] antialiased min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
