<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="dv-grad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <filter id="dv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#040b0d" stroke="#15303a" stroke-width="2" />
  
  <!-- Stylized D-V interconnected monogram -->
  <path d="M18 16 H32 C42 16 48 23 48 32 C48 41 42 48 32 48 H18 V16 Z" 
        stroke="url(#dv-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M30 26 L38 38 L46 26" 
        stroke="#2dd4bf" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#dv-glow)" />
</svg>
